{% extends 'hostel/base.html' %}

{% block title %}User Login - HostelEase{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm p-4 p-md-5 bg-white">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill text-primary display-4"></i>
                <h3 class="fw-bold mt-2">Sign In</h3>
                <p class="text-muted">Access your Student or Warden Portal</p>
            </div>

            <form method="POST" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>
                </div>
            </form>

            <div class="text-center mt-4">
                <p class="mb-1 text-muted">New student? <a href="{% url 'register' %}" class="fw-semibold">Create account</a></p>
                <small class="text-muted">Hostel wardens can login using their staff credentials.</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
